
name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings file not found."
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          APK=$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was generated."
            exit 1
          fi

          echo "path=${{ steps.project.outputs.dir }}/$APK" \
            >> "$GITHUB_OUTPUT"

          echo "APK generated: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
