name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Could not detect Java version."
            exit 1
          fi
          
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java Major Version: $MAJOR_VER"
          
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required. Found version: $MAJOR_VER"
            exit 1
          fi
          echo "Java version check passed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            echo "Searching app/build/outputs/apk for any generated APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file is empty: $EXPECTED_APK"
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK"; exit 1 ;;
          esac
          
          echo "Verified debug APK: $EXPECTED_APK ($(stat -c%s "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RELEASE_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$RELEASE_DIR/app-debug.apk"
          
          if [ ! -s "$RELEASE_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare release asset app-debug.apk"
            exit 1
          fi
          
          echo "Prepared release asset: $RELEASE_DIR/app-debug.apk"
          echo "asset_path=$RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Verification ==="
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi
          
          FILENAME=$(basename "$ASSET_PATH")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk, got: $FILENAME"
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}
          - Purpose: Testing only
          - Notice: This APK is not a Play Store production release.
          - Signature: Signed with a temporary debug keystore.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== Release Published Successfully ==="
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$TAG_NAME"
            
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "APK Asset Name: app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"
            
            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct download link for latest debug APK:" >> "$GITHUB_STEP_SUMMARY"
            echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> The GitHub Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release creation did not succeed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the backup Actions artifact 'app-debug-apk' was uploaded successfully."
            fi
            echo "## BUILD SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Release publication failed or was skipped, but the Actions artifact \`app-debug-apk\` remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          fi
